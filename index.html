<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Microsearch — คลังข้อมูลจุลชีววิทยา</title>
<meta name="description" content="คลังอ้างอิงจุลชีพก่อโรคในมนุษย์ — แบคทีเรีย ไวรัส ปรสิต" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fdfaf6;
    --bg-soft: #f4ede2;
    --text: #2d3748;
    --text-soft: #4a5568;
    --muted: #94a3b8;
    --bacteria: #ff8a65;
    --virus: #4fc3f7;
    --parasite: #9575cd;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Sarabun', 'Inter', 'Segoe UI', Tahoma, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 40%, #fffaf1 0%, var(--bg) 55%, var(--bg-soft) 100%);
    min-height: 100vh;
    overflow: hidden;
  }

  #fx {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: block;
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    pointer-events: none;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(45, 55, 72, 0.08);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-soft);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.9s 0.4s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary);
  }

  h1 {
    font-size: clamp(40px, 7vw, 84px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    color: var(--text);
    opacity: 0;
    transform: translateY(12px);
    animation: rise 1.1s 0.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  h1 .accent {
    font-weight: 300;
    font-style: italic;
    background: linear-gradient(120deg, var(--bacteria), var(--virus) 55%, var(--parasite));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--text-soft);
    margin: 22px auto 0;
    max-width: 520px;
    line-height: 1.7;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 1.1s 0.85s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .kingdoms {
    display: flex; gap: 18px; justify-content: center;
    margin-top: 18px;
    font-size: 13px; color: var(--muted);
    opacity: 0;
    animation: rise 1.1s 1.05s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .kingdoms span { display: inline-flex; align-items: center; gap: 6px; }
  .kingdoms i {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .k-b i { background: var(--bacteria); }
  .k-v i { background: var(--virus); }
  .k-p i { background: var(--parasite); }

  .enter {
    pointer-events: auto;
    margin-top: 52px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px;
    border: 1px solid var(--text);
    background: var(--text);
    color: var(--bg);
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-decoration: none;
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 1.1s 1.25s cubic-bezier(.2,.7,.2,1) forwards;
    box-shadow: 0 8px 24px rgba(45,55,72,.18);
  }
  .enter:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(45,55,72,.24);
    background: var(--primary-dark);
    border-color: var(--primary-dark);
  }
  .enter .arrow { transition: transform .25s ease; }
  .enter:hover .arrow { transform: translateX(4px); }

  .skip {
    pointer-events: auto;
    position: fixed;
    top: 22px; right: 24px;
    z-index: 3;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.06em;
    opacity: 0;
    animation: fadein 0.8s 1.6s forwards;
  }
  .skip:hover { color: var(--text); }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadein {
    to { opacity: 1; }
  }

  /* fade-out when entering site */
  body.leaving { transition: opacity .45s ease, filter .45s ease; opacity: 0; filter: blur(4px); }

  @media (prefers-reduced-motion: reduce) {
    .pill, h1, .tagline, .kingdoms, .enter, .skip { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <a class="skip" href="app.html">ข้าม →</a>

  <div class="stage">
    <span class="pill"><span class="dot"></span>คลังอ้างอิงจุลชีพก่อโรค</span>
    <h1>Microsearch<br><span class="accent">ค้นหา</span> เชื้อก่อโรค</h1>
    <p class="tagline">
      ข้อมูลเชื้อแบคทีเรีย ไวรัส และปรสิต ที่ก่อโรคในมนุษย์ พร้อมลักษณะ การก่อโรค การติดต่อ การวินิจฉัย และการรักษา — อ้างอิงจากแหล่งที่ตรวจสอบได้
    </p>
    <div class="kingdoms">
      <span class="k-b"><i></i>แบคทีเรีย</span>
      <span class="k-v"><i></i>ไวรัส</span>
      <span class="k-p"><i></i>ปรสิต</span>
    </div>
    <a class="enter" href="app.html" id="enterBtn">
      เข้าสู่เว็บไซต์ <span class="arrow">→</span>
    </a>
  </div>

<script>
(function () {
  'use strict';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  const palette = [
    { r: 255, g: 138, b: 101 }, // bacteria
    { r: 79,  g: 195, b: 247 }, // virus
    { r: 149, g: 117, b: 205 }, // parasite
  ];

  const mobile = matchMedia('(max-width: 640px)').matches;
  const PARTICLE_COUNT = reduceMotion ? 80 : (mobile ? 500 : 1400);
  const REVEAL_MS = 3200;
  const startTime = performance.now();

  // Flow-field parameters (mimics original's noise-driven simulation)
  const FLOW_SCALE = 0.0022;   // spatial frequency of the noise
  const FLOW_TIME = 0.00018;   // how fast the field evolves
  const FLOW_SPEED = 0.55;     // particle speed along the field
  const FLOW_DAMP = 0.92;      // velocity damping each frame
  const FOCAL_Z = 0.5;         // focal plane for fake DOF

  const mouse = { x: -9999, y: -9999, active: false };

  const particles = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticle() {
    // Polar distribution so particles cluster nicely around center
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.pow(Math.random(), 0.6) * Math.min(W, H) * 0.6;
    const cx = W / 2, cy = H / 2;
    const color = palette[(Math.random() * palette.length) | 0];
    const z = Math.random();           // fake depth 0..1 for DOF
    const depthFromFocal = Math.abs(z - FOCAL_Z) * 2; // 0 sharp .. 1 blurry
    return {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius,
      // base radius scales with closeness to focal plane (closer = larger sharp)
      r: 0.6 + (1 - depthFromFocal) * 1.8 + Math.random() * 0.6,
      vx: 0, vy: 0,
      a: 0.25 + (1 - depthFromFocal) * 0.55,
      revealDist: radius,
      color,
      z,
      depth: depthFromFocal,         // 0 sharp .. 1 blurry
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.004 + Math.random() * 0.008,
      // each particle samples flow with a slight phase offset for organic feel
      phase: Math.random() * 6.283,
    };
  }

  // Smooth pseudo-noise: sum of sines at different frequencies + rotations
  // Returns an angle in radians for the flow direction at (x, y, t)
  function flowAngle(x, y, t) {
    const a =
      Math.sin(x * 1.0 + y * 0.7 + t * 1.3) +
      Math.cos(x * 0.6 - y * 1.1 + t * 0.9) * 0.7 +
      Math.sin(x * 1.7 - y * 0.4 - t * 1.6) * 0.5 +
      Math.cos(x * 0.3 + y * 0.4 - t * 0.6) * 0.4;
    // Map roughly to [-1, 1] then to angle, multiply for rotation count
    return a * 1.8;
  }

  function initParticles() {
    particles.length = 0;
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(makeParticle());
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / REVEAL_MS, 1);
    const reveal = easeOutCubic(t);

    ctx.clearRect(0, 0, W, H);

    // Subtle radial glow under particles
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.55);
    grad.addColorStop(0, 'rgba(255, 250, 240, 0.6)');
    grad.addColorStop(1, 'rgba(255, 250, 240, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const maxRevealRadius = Math.min(W, H) * 0.6;
    const revealRadius = reveal * maxRevealRadius * 1.5;

    // Time in flow-field units
    const ft = now * FLOW_TIME;

    // Sort by depth so blurry-far particles render under sharp-near (cheap DOF stacking)
    // Done once per frame is O(n log n) — fine at <2k particles
    // Skip on mobile to save CPU
    if (!mobile && reveal > 0.95 && (frameCounter++ & 31) === 0) {
      particles.sort((a, b) => b.depth - a.depth);
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // Reveal: only show if its distance is within current reveal radius
      const revealAlpha = Math.min(1, Math.max(0, (revealRadius - p.revealDist) / 60));
      if (revealAlpha <= 0) continue;

      if (!reduceMotion) {
        // Sample flow field — angle drives velocity
        // Slower flow for distant (blurry) particles → parallax depth illusion
        const depthSpeed = 1 - p.depth * 0.5;
        const ang = flowAngle(p.x * FLOW_SCALE, p.y * FLOW_SCALE, ft + p.phase * 0.05);
        p.vx += Math.cos(ang) * FLOW_SPEED * depthSpeed * 0.18;
        p.vy += Math.sin(ang) * FLOW_SPEED * depthSpeed * 0.18;

        // Damping → smooth flowing feel
        p.vx *= FLOW_DAMP;
        p.vy *= FLOW_DAMP;

        p.x += p.vx;
        p.y += p.vy;
        p.pulse += p.pulseSpeed;

        // Mouse repel — only affects sharp foreground particles for parallax
        if (mouse.active && p.depth < 0.7) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 22500) { // 150px radius
            const d = Math.sqrt(d2) || 1;
            const force = (1 - d / 150) * (1 - p.depth) * 1.6;
            p.x += (dx / d) * force;
            p.y += (dy / d) * force;
          }
        }

        // Soft respawn: if drifted far off-screen, recycle around the centre
        if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.pow(Math.random(), 0.6) * Math.min(W, H) * 0.45;
          p.x = W / 2 + Math.cos(angle) * radius;
          p.y = H / 2 + Math.sin(angle) * radius;
          p.vx = 0; p.vy = 0;
        }
      }

      const breathe = 0.88 + Math.sin(p.pulse) * 0.12;
      const alpha = p.a * revealAlpha * breathe;
      const c = p.color;

      // Glow radius grows with depth (out-of-focus particles = larger soft halo)
      const glowR = p.r * (3 + p.depth * 5);
      const glowA = alpha * (0.12 + p.depth * 0.18);

      ctx.fillStyle = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + glowA + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Core (suppressed for very blurry particles → they're all glow)
      if (p.depth < 0.85) {
        ctx.fillStyle = 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(frame);
  }
  let frameCounter = 0;

  // Setup
  resize();
  initParticles();
  window.addEventListener('resize', () => { resize(); initParticles(); });

  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('pointerleave', () => { mouse.active = false; });

  requestAnimationFrame(frame);

  // Enter button: fade out then navigate
  const enterBtn = document.getElementById('enterBtn');
  enterBtn.addEventListener('click', (e) => {
    e.preventDefault();
    document.body.classList.add('leaving');
    setTimeout(() => { window.location.href = 'app.html'; }, 420);
  });
})();
</script>
</body>
</html>
